{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART FIT - Iniciar Sesión</title>
    <link rel="stylesheet" href="{% static 'core/css/login.css' %}">
</head>

<body>
    <main class="login-card">
        <h1 class="logo">SMART FIT</h1>
        <h2>Iniciar Sesión</h2>

        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <p class="registro">
            ¿No tienes una cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a>
        </p>

        <p class="registro">
            ¿Eres entrenador? <a href="{% url 'login_entrenador' %}">Ingresa aquí</a>
        </p>

    </main>
</body>

</html>
