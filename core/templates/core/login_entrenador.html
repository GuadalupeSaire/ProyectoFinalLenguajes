{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART FIT - Acceso Entrenador</title>
    <link rel="stylesheet" href="{% static 'core/css/login.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/login_entrenador.css' %}">
</head>
<body>
    <main class="login-card">
        <h1 class="logo">SMART FIT</h1>
        <h2>Acceso Entrenador</h2>

        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Correo del entrenador" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <p class="registro">
            ¿Eres socio? <a href="{% url 'login' %}">Ingresa aquí</a>
        </p>
    </main>
</body>
</html>
